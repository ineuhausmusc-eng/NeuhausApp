<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuhaus Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0E12;
    --panel:#121820;
    --panel-2:#0E141B;
    --line:#22303A;
    --paper:#EDEFEC;
    --paper-dim:#B9C2C3;
    --peach:#F3D9AE;
    --peach-dim:#C9AE85;
    --g1:#F6E3C2;
    --g2:#E0A968;
    --g3:#B9662F;
    --g4:#5A2E14;
    --signal:#C1571F;
    --signal-dim:#8C3F14;
    --n1:#EAF2FB;
    --n2:#5F86B8;
    --n3:#22335C;
    --n4:#0A1220;
    --navy-text:#1B2A4A;
    --font-display:'Archivo', sans-serif;
    --font-head:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--signal); color:var(--ink);}
  svg{overflow:visible;}

  /* ---------- TOP NAV: normal flow, centered, scrolls away with intro page ---------- */
  header{
    position:relative;
    width:100%;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 24px 0;
  }
  nav{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    flex-wrap:wrap;
  }
  nav a{
    font-family:var(--font-display); font-weight:800;
    font-size:clamp(16.5px, 2.024vw, 25.3px);
    letter-spacing:0.07em;
    color:var(--peach); transition:opacity .2s; opacity:0.92;
  }
  nav a:hover{opacity:1;}
  nav .nav-tagline{
    font-family:var(--font-display); font-weight:800;
    font-size:clamp(11px, 1.35vw, 16.9px);
    letter-spacing:0.14em;
    color:var(--peach-dim);
    opacity:0.85;
  }

  /* "APPS" nav heading — clustered spectral-light gradient (blue/violet dominant,
     cyan + pink-violet accents, icy-white highlight points), crisp bold
     letterforms with a controlled, non-blurry drop-shadow glow. Static — no animation. */
  nav a.nav-apps{
    font-weight:900;
    font-size:clamp(20.625px, 2.53vw, 31.625px);
    letter-spacing:0.0735em;
    background:
      radial-gradient(circle at 20% 30%, rgba(248,250,255,0.9) 0%, rgba(248,250,255,0) 6%),
      radial-gradient(circle at 70% 65%, rgba(248,250,255,0.7) 0%, rgba(248,250,255,0) 5%),
      linear-gradient(105deg, #6485ff 0%, #8068ff 30%, #a56cff 48%, #6d7dff 68%, #75a6ff 84%, #9a63ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:1 !important;
    text-shadow:none;
    filter:
      saturate(1.2)
      drop-shadow(0 0 2px rgba(123, 101, 255, 0.65))
      drop-shadow(0 0 5px rgba(91, 86, 255, 0.25));
    -webkit-font-smoothing:antialiased;
  }
  nav a.nav-apps:hover{ opacity:1 !important; }

  section{position:relative;}

  /* ---------- HERO: single artwork hero, palette-matched atmosphere ---------- */
  #hero{
    min-height:100vh;
    min-height:100svh;
    padding:0;
    display:flex; align-items:flex-start; justify-content:center;
    background:var(--ink);
    position:relative; overflow:hidden;
  }

  /* Layer 1: full-width gradient background, colors drawn from the artwork's own
     near-black / oxblood / ember / copper / antique-gold palette, so the hero
     reads as one continuous environment even where the image doesn't reach. */
  .hero-atmosphere{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 44% 62% at 6% 50%, rgba(122,26,31,0.40) 0%, rgba(90,20,20,0.16) 42%, transparent 72%),
      radial-gradient(ellipse 44% 62% at 94% 50%, rgba(185,102,47,0.34) 0%, rgba(122,26,31,0.15) 42%, transparent 74%),
      radial-gradient(ellipse 58% 50% at 50% 46%, rgba(102,36,18,0.22) 0%, transparent 66%),
      linear-gradient(180deg, #04060A 0%, #0A0E12 26%, #0A0E12 74%, #04060A 100%);
  }
  .hero-atmosphere-grain{
    position:absolute; inset:0; z-index:1;
    filter:url(#grainFilter);
    opacity:0.045; mix-blend-mode:overlay; pointer-events:none;
  }

  /* Layer 2: the artwork itself — centered, unaltered, aspect-ratio locked so it
     never stretches or distorts, capped by both viewport width and height so it
     never overflows or gets cropped on very wide or very short screens.
     Anchored a little higher in the section (small fixed top gap, auto bottom
     margin) instead of being perfectly vertically centered. */
  .hero-art-wrap{
    position:relative; z-index:2;
    width:min(92vw, calc(86svh * 1.8744));
    max-width:1717px;
    aspect-ratio:1717 / 916;
    margin:clamp(4px, 1.5vh, 24px) auto auto auto;
    overflow:hidden;
  }
  .hero-art-wrap picture{
    display:block; width:100%; height:100%;
  }
  .hero-art-wrap img{
    display:block; width:100%; height:100%;
    object-fit:contain;
    object-position:center center;
  }

  /* Layer 3: soft feathered mist tucked into the outer edges of the artwork,
     concentrated at the corners (background/particle areas) so the hands,
     app icon and type are never obscured, plus a light overall vignette. */
  .hero-mist{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .hero-mist-left{
    background:
      radial-gradient(ellipse 60% 40% at 0% 0%, rgba(3,2,2,0.9), transparent 68%),
      radial-gradient(ellipse 60% 40% at 0% 100%, rgba(3,2,2,0.9), transparent 68%),
      linear-gradient(to right, rgba(3,2,2,0.26) 0%, rgba(3,2,2,0.08) 8%, transparent 13%);
    filter:blur(5px);
  }
  .hero-mist-right{
    background:
      radial-gradient(ellipse 60% 40% at 100% 0%, rgba(3,2,2,0.9), transparent 68%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(3,2,2,0.9), transparent 68%),
      linear-gradient(to left, rgba(3,2,2,0.26) 0%, rgba(3,2,2,0.08) 8%, transparent 13%);
    filter:blur(5px);
  }
  .hero-vignette-outer{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse 82% 80% at 50% 50%, transparent 64%, rgba(4,6,8,0.46) 90%, var(--ink) 100%);
  }

  /* ---------- PAGE 2: PRAYER MATTERS PROMO (moved up, redesigned) ---------- */
  #third{
    min-height:100vh;
    background:var(--ink);
    padding:64px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .third-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .tblob{ position:absolute; border-radius:50%; filter:blur(90px); mix-blend-mode:screen; opacity:0.5; will-change:transform; }
  .tblob-a{
    width:50vw; height:50vw; left:-10%; top:-8%;
    background:radial-gradient(circle at 40% 40%, var(--n1) 0%, var(--n2) 42%, transparent 72%);
    animation:driftA 34s ease-in-out infinite alternate;
  }
  .tblob-b{
    width:46vw; height:46vw; right:-12%; bottom:-12%;
    background:radial-gradient(circle at 60% 35%, var(--n2) 0%, var(--n3) 45%, transparent 72%);
    animation:driftB 42s ease-in-out infinite alternate;
  }
  .tblob-c{
    width:22vw; height:22vw; right:4%; top:6%;
    background:radial-gradient(circle at 50% 50%, var(--n1) 0%, transparent 70%);
    opacity:0.35;
    animation:driftC 26s ease-in-out infinite alternate;
  }
  .tblob-d{
    width:26vw; height:26vw; left:6%; bottom:4%;
    background:radial-gradient(circle at 50% 50%, var(--n4) 0%, transparent 75%);
    opacity:0.4;
    animation:driftD 30s ease-in-out infinite alternate;
  }
  .third-vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 62% 62% at 50% 50%, transparent 42%, var(--ink) 92%);
  }
  .pm-showcase{
    width:min(86vw, 1240px);
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
  }
  .pm-showcase img{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:1448 / 1086;
    object-fit:contain;
  }

  /* ---------- APP HERO TOGGLE (Prayer Matters / Medical segmented control) ---------- */
  .app-hero-content{
    width:100%;
  }
  .app-hero-content--medical{
    aspect-ratio:1448 / 1086;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    border-radius:18px;
  }
  .app-hero-medical-placeholder{
    font-family:var(--font-mono);
    font-size:clamp(13px, 1.3vw, 19px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--paper-dim);
    text-align:center;
    padding:0 24px;
  }
  .app-hero-toggle{
    position:relative;
    width:31.2%;
    min-width:230px;
    aspect-ratio:7 / 1;
    display:flex;
    border-radius:999px;
    background:#F1ECFB;
    border:1.5px solid rgba(255,255,255,0.95);
    box-shadow:
      0 0 10px rgba(255,255,255,0.25),
      0 0 24px rgba(123,54,255,0.35),
      0 0 44px rgba(37,115,255,0.2);
    overflow:hidden;
  }
  .app-hero-toggle__bg{
    position:absolute;
    top:0; left:0;
    width:50%; height:100%;
    border-radius:999px;
    background:linear-gradient(135deg, #5B16E8 0%, #3215B8 48%, #056FEA 100%);
    border:1.5px solid rgba(255,255,255,0.95);
    box-shadow:
      0 0 8px rgba(255,255,255,0.75),
      0 0 18px rgba(123,54,255,0.85),
      0 0 32px rgba(37,115,255,0.45);
    transition:transform 300ms cubic-bezier(0.4,0,0.2,1);
    z-index:1;
    pointer-events:none;
  }
  .app-hero-toggle[data-active="medical"] .app-hero-toggle__bg{
    transform:translateX(100%);
  }
  .app-hero-toggle__btn{
    position:relative;
    z-index:2;
    flex:1 1 50%;
    border:none;
    background:transparent;
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(9.5px, 1.05vw, 15px);
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#14133D;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    white-space:nowrap;
    transition:color 300ms ease;
  }
  .app-hero-toggle[data-active="prayer"] .app-hero-toggle__btn--prayer{ color:#FFFFFF; }
  .app-hero-toggle[data-active="medical"] .app-hero-toggle__btn--medical{ color:#FFFFFF; }
  .app-hero-toggle__btn:focus-visible{
    outline:2px solid #FFFFFF;
    outline-offset:2px;
    border-radius:999px;
  }
  @media (max-width:760px){
    .app-hero-toggle{ min-width:210px; }
    .app-hero-medical-placeholder{ font-size:12px; }
  }

  /* ---------- PAGE 3: HAND / CARDS SECTION (moved down, immediately before footer) ---------- */
  #second{
    min-height:100vh; background:var(--ink);
    position:relative; overflow:hidden;
  }
  .second-stage{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
    width:min(48vw, 620px); aspect-ratio:1122/1402; z-index:0;
  }
  .second-photo{
    position:absolute; inset:0;
    background-image:url('assets/second-page-photo.jpg');
    background-size:cover; background-position:center top;
    opacity:0.85;
    filter:saturate(1.05) contrast(1.04) brightness(0.94);
    -webkit-mask-image:radial-gradient(ellipse 92% 66% at 50% 42%, #000 60%, transparent 90%);
    mask-image:radial-gradient(ellipse 92% 66% at 50% 42%, #000 60%, transparent 90%);
  }
  .hand-card{ position:absolute; z-index:3; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4)); }
  .hand-card img{ width:100%; display:block; }
  .hand-card.left{ left:2%; top:43%; width:34%; transform:rotate(-4deg); border-radius:10%/6%; overflow:hidden; }
  .hand-card.center{ left:36%; top:39%; width:32%; border-radius:10%/5%; overflow:hidden; }
  .hand-card.right{ left:68%; top:50%; width:32%; transform:rotate(4deg); }
  .second-bg{ position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
  .sblob{ position:absolute; border-radius:50%; filter:blur(90px); mix-blend-mode:screen; opacity:0.55; will-change:transform; }
  .sblob-a{
    width:50vw; height:50vw; left:-10%; top:-10%;
    background:radial-gradient(circle at 40% 40%, var(--n1) 0%, var(--n2) 42%, transparent 72%);
    animation:driftA 34s ease-in-out infinite alternate;
  }
  .sblob-b{
    width:46vw; height:46vw; right:-12%; bottom:-14%;
    background:radial-gradient(circle at 60% 35%, var(--n2) 0%, var(--n3) 45%, transparent 72%);
    animation:driftB 42s ease-in-out infinite alternate;
  }
  .sblob-c{
    width:20vw; height:20vw; right:6%; top:8%;
    background:radial-gradient(circle at 50% 50%, var(--n1) 0%, transparent 70%);
    opacity:0.4;
    animation:driftC 26s ease-in-out infinite alternate;
  }
  .sblob-d{
    width:26vw; height:26vw; left:8%; bottom:6%;
    background:radial-gradient(circle at 50% 50%, var(--n4) 0%, transparent 75%);
    opacity:0.4;
    animation:driftD 30s ease-in-out infinite alternate;
  }
  .second-vignette{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse 75% 65% at 50% 45%, transparent 55%, var(--ink) 96%);
  }
  .second-text{
    position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
    z-index:5; text-align:center; white-space:nowrap;
    font-family:var(--font-display); font-weight:900;
    font-size:clamp(28.5px, 5.225vw, 76px); letter-spacing:-0.015em;
    color:var(--navy-text);
    -webkit-text-stroke:clamp(2.2px, 0.42vw, 6px) rgba(255,255,255,0.92);
    text-stroke:clamp(2.2px, 0.42vw, 6px) rgba(255,255,255,0.92);
    paint-order:stroke fill;
  }

  /* ---------- PAGE 4: PRAYER MATTERS — FULL MOCKUP SHOWCASE ---------- */
  #fourth{
    min-height:100vh;
    background:var(--ink);
    padding:80px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .fourth-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  /* base atmosphere: deep violet under the headline, indigo/blue under the phone, soft blue-violet under the download bar, near-black at the edges */
  .fourth-atmosphere{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 46% 50% at 14% 22%, rgba(58,22,120,0.55) 0%, rgba(58,22,120,0.22) 45%, transparent 72%),
      radial-gradient(ellipse 52% 58% at 58% 46%, rgba(15,60,150,0.5) 0%, rgba(20,50,140,0.22) 46%, transparent 74%),
      radial-gradient(ellipse 40% 42% at 52% 92%, rgba(70,40,150,0.4) 0%, rgba(50,30,120,0.16) 50%, transparent 78%),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 40%, var(--ink) 88%);
    animation:fourthAtmosDrift 70s ease-in-out infinite alternate;
  }
  @keyframes fourthAtmosDrift{
    0%{ background-position:0 0, 0 0, 0 0, 0 0; }
    100%{ background-position:1.5% -1%, -1.5% 1.5%, 1% -1.5%, 0 0; }
  }
  .fblob{ position:absolute; border-radius:50%; filter:blur(100px); mix-blend-mode:screen; opacity:0.5; will-change:transform; pointer-events:none; }
  .fblob-a{
    width:54vw; height:54vw; left:-16%; top:-12%;
    background:radial-gradient(circle at 40% 40%, #6B2FF0 0%, #3215B8 42%, transparent 74%);
    animation:driftA 36s ease-in-out infinite alternate;
  }
  .fblob-b{
    width:50vw; height:50vw; right:-16%; bottom:-14%;
    background:radial-gradient(circle at 60% 35%, #1C86F2 0%, #23319C 45%, transparent 74%);
    animation:driftB 44s ease-in-out infinite alternate;
  }
  .fblob-c{
    width:24vw; height:24vw; right:6%; top:10%;
    background:radial-gradient(circle at 50% 50%, #056FEA 0%, transparent 70%);
    opacity:0.3;
    animation:driftC 27s ease-in-out infinite alternate;
  }
  .fblob-d{
    width:26vw; height:26vw; left:8%; bottom:8%;
    background:radial-gradient(circle at 50% 50%, #7B3FF2 0%, transparent 75%);
    opacity:0.3;
    animation:driftD 31s ease-in-out infinite alternate;
  }
  .fourth-grain{
    position:absolute; inset:0; z-index:2;
    filter:url(#grainFilter);
    opacity:0.025; mix-blend-mode:overlay; pointer-events:none;
  }
  .fourth-particles{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .fparticle{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(210,190,255,0.9) 0%, rgba(140,120,255,0.35) 45%, transparent 75%);
    filter:blur(1px);
    opacity:0.35;
    animation:fparticleDrift 26s ease-in-out infinite alternate;
  }
  .fp1{ width:5px; height:5px; left:18%; top:20%; animation-duration:24s; }
  .fp2{ width:3px; height:3px; left:34%; top:62%; animation-duration:31s; animation-delay:-4s; }
  .fp3{ width:4px; height:4px; left:52%; top:14%; animation-duration:27s; animation-delay:-9s; }
  .fp4{ width:3px; height:3px; left:64%; top:78%; animation-duration:33s; animation-delay:-14s; }
  .fp5{ width:6px; height:6px; left:76%; top:30%; animation-duration:29s; animation-delay:-6s; }
  .fp6{ width:3px; height:3px; left:10%; top:70%; animation-duration:35s; animation-delay:-18s; }
  .fp7{ width:4px; height:4px; left:88%; top:60%; animation-duration:25s; animation-delay:-11s; }
  .fp8{ width:3px; height:3px; left:45%; top:88%; animation-duration:32s; animation-delay:-2s; }
  @keyframes fparticleDrift{
    0%{ transform:translate(0,0); opacity:0.2; }
    50%{ opacity:0.5; }
    100%{ transform:translate(1.6vw, -1.4vh); opacity:0.2; }
  }
  .fourth-vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 70% 62% at 50% 50%, transparent 44%, var(--ink) 94%);
  }

  /* ---------- PM4: standalone floating phone, laid out to match the mockup's exact composition ---------- */
  .pm4-stage{
    position:relative;
    z-index:2;
    width:min(94vw, 1500px);
    aspect-ratio:1798/875;
    margin:0 auto;
    container-type:inline-size;
    container-name:pm4;
  }

  .pm4-headline-block{ position:absolute; left:2.8%; top:4%; max-width:46%; z-index:5; }
  .pm4-headline{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:clamp(30px, 4.6cqw, 68px); line-height:1.05;
    color:#FBF6EC; margin-bottom:clamp(14px,1.8cqw,26px);
  }
  .pm4-headline .glow-pray{
    background:linear-gradient(135deg, #9B7CFF 0%, #4FA8FF 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(91,22,232,0.5)) drop-shadow(0 0 28px rgba(5,111,234,0.28));
  }
  .pm4-headline .glow-still{
    background:linear-gradient(135deg, #C9A9FF 0%, #8F6FFB 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(139,92,246,0.5)) drop-shadow(0 0 28px rgba(139,92,246,0.24));
  }
  .pm4-sub{
    font-family:var(--font-body); font-size:clamp(13px,1.05cqw,16px); line-height:1.6;
    color:#CBD3D6; max-width:340px; margin-bottom:clamp(18px,2cqw,30px);
  }
  .pm4-btn-explore{
    position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    padding:clamp(10px,1.1cqw,15px) clamp(20px,2.4cqw,32px); border-radius:999px;
    font-family:var(--font-display); font-weight:800; font-size:clamp(12px,0.95cqw,14px); letter-spacing:0.02em;
    color:#fff;
    background:linear-gradient(135deg, #6E24F5 0%, #3B1AC2 46%, #1487F5 100%);
    box-shadow:0 10px 30px rgba(60,25,190,0.5), 0 0 22px rgba(20,135,245,0.25), 0 0 0 1px rgba(255,255,255,0.1) inset, 0 1px 0 rgba(255,255,255,0.35) inset;
    transition:transform .2s ease, box-shadow .2s ease;
    margin-bottom:clamp(14px,1.6cqw,22px);
  }
  .pm4-btn-explore::before{
    content:''; position:absolute; inset:0; border-radius:999px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 55%);
    mix-blend-mode:overlay;
  }
  .pm4-btn-explore:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(60,25,190,0.6), 0 0 28px rgba(20,135,245,0.35), 0 0 0 1px rgba(255,255,255,0.12) inset; }
  .pm4-tagline{
    display:block;
